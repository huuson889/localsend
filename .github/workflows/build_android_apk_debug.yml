name: Build Android APK (debug)

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      # No keystore secrets needed: debug builds are signed with the
      # automatic debug key, so this works on forks out of the box.

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Check rust-toolchain.toml
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates
        run: rustup show

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      # Single APK for modern 64-bit ARM phones (no split-per-abi): one
      # output file, and it skips building the x86_64/armeabi-v7a native
      # libraries entirely, which also makes the build faster.
      - name: Build APK (debug, arm64 only)
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --debug --target-platform android-arm64

      - name: Rename APK (include version)
        run: |
          mv "${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-debug.apk" \
             "${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/LocalSend-${{ needs.build.outputs.version }}-debug-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-result-debug-${{ needs.build.outputs.version }}
          path: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/LocalSend-${{ needs.build.outputs.version }}-debug-arm64.apk
          if-no-files-found: error

      # Every build also lands on the GitHub Releases page (prerelease).
      # The Windows workflow publishes the EXE to the same release; the
      # two usually finish minutes apart, so the release simply gains its
      # second file when the other build completes.
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}-paired-sync
          name: LocalSend Paired Sync v${{ needs.build.outputs.version }}
          prerelease: true
          body: |
            Unofficial fork build of LocalSend with **paired sync** (test builds: Android APK is a debug build, Windows installer is unsigned).

            ### Highlights
            - Paired sync between trusted devices: pair with the heart button + 6-digit PIN on both devices
            - Sync with **multiple devices** — each pair syncs independently, content is never forwarded between pairs
            - Auto **clipboard sync** (text up to 16 KB, images up to 8 MB) both ways
            - Auto **shared folder sync** both ways (new/changed files; deletions are not synced)
            - Sync only while the paired device is discovered; offline peers are waited for silently

            ### Downloads
            - Android: `LocalSend-${{ needs.build.outputs.version }}-debug-arm64.apk` (arm64, debug)
            - Windows: `LocalSend-${{ needs.build.outputs.version }}-windows-x64-unsigned.exe` (unsigned — Windows SmartScreen may warn; appears here once the Windows build finishes)

            Per-version details are in the pull request / commit history of this fork.
          files: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/LocalSend-${{ needs.build.outputs.version }}-debug-arm64.apk
          fail_on_unmatched_files: true
