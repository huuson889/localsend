name: Backfill paired-sync releases (one-time)

# One-time helper: creates the GitHub prereleases for paired-sync versions
# that were built before the build workflows learned to publish releases
# themselves. Triggered by pushing this file; delete it once it has run.
on:
  push:
    branches: [arena/47011167-localsend]
    paths: [.github/workflows/backfill_releases.yml]

permissions:
  contents: write

jobs:
  backfill:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.19.0"
            apk_run_id: "45083054438"
            exe_run_id: "45083056711"
            target: "226996078fafd6879c6d4e4606897a643e25748d"
          - version: "1.19.1"
            apk_run_id: "45085162784"
            exe_run_id: "45085164850"
            target: "5c6e87b85dd0b8304fda5cef53c359cb77083511"
          - version: "1.19.2"
            apk_run_id: "45091357310"
            exe_run_id: "45091360109"
            target: "24a73abc7c043ef17203b70e936612a6bff2b0c1"
          - version: "1.19.3"
            apk_run_id: "45099093732"
            exe_run_id: "45099096096"
            target: "35a625c71d28ac38f7ce36d46119e13679934b4a"
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: apk-result-debug-${{ matrix.version }}
          run-id: ${{ matrix.apk_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl/apk

      - name: Download EXE artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-exe-x86-64-unsigned-${{ matrix.version }}
          run-id: ${{ matrix.exe_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl/exe

      - name: Create or update prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.version }}-paired-sync
          name: LocalSend Paired Sync v${{ matrix.version }}
          target_commitish: ${{ matrix.target }}
          prerelease: true
          body: |
            Unofficial fork build of LocalSend with **paired sync** (test builds: Android APK is a debug build, Windows installer is unsigned).

            ### Highlights
            - Paired sync between trusted devices: pair with the heart button + 6-digit PIN on both devices
            - Sync with **multiple devices** — each pair syncs independently, content is never forwarded between pairs
            - Auto **clipboard sync** (text up to 16 KB, images up to 8 MB) both ways
            - Auto **shared folder sync** both ways (new/changed files; deletions are not synced)
            - Sync only while the paired device is discovered; offline peers are waited for silently

            ### Downloads
            - Android: `LocalSend-${{ matrix.version }}-debug-arm64.apk` (arm64, debug)
            - Windows: `LocalSend-${{ matrix.version }}-windows-x64-unsigned.exe` (unsigned — Windows SmartScreen may warn)

            Per-version details are in the pull request / commit history of this fork.
          files: |
            dl/apk/*.apk
            dl/exe/*.exe
          fail_on_unmatched_files: true
