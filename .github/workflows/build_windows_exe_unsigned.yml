name: Build windows exe (unsigned)

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_windows_exe_x86_64:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      # Required by the CMake install step (app/windows/CMakeLists.txt installs localsend_msix_helper.msix)
      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Prepare Inno Setup payload
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno" | Out-Null
          Copy-Item -Path "app\build\windows\x64\runner\Release\*" -Destination "${{ runner.temp }}\inno" -Recurse
          Copy-Item -Path "app\assets\packaging\logo.ico" -Destination "${{ runner.temp }}\inno"
          Copy-Item -Path "support\build\windows\x64\*" -Destination "${{ runner.temp }}\inno" -Recurse
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno-result" | Out-Null

      # SkipMsixHelper: the helper would be unsigned and Add-AppxPackage rejects unsigned packages
      - name: Compile installer (unsigned)
        run: iscc /DSkipSignTool /DSkipMsixHelper "/DPayloadDir=${{ runner.temp }}\inno" "/DResultDir=${{ runner.temp }}\inno-result" support\scripts\compile_windows_exe-inno.iss

      - name: Rename installer
        run: Rename-Item -Path "${{ runner.temp }}\inno-result\localsend.exe" -NewName "LocalSend-${{ needs.build.outputs.version }}-windows-x64-unsigned.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe-x86-64-unsigned-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}\inno-result\LocalSend-${{ needs.build.outputs.version }}-windows-x64-unsigned.exe
          if-no-files-found: error

      # Every build also lands on the GitHub Releases page (prerelease).
      # The Android workflow publishes the APK to the same release; the
      # two usually finish minutes apart, so the release simply gains its
      # second file when the other build completes.
      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}-paired-sync
          name: LocalSend Paired Sync v${{ needs.build.outputs.version }}
          prerelease: true
          body: |
            Unofficial fork build of LocalSend with **paired sync** (test builds: Android APK is a debug build, Windows installer is unsigned).

            ### Highlights
            - Paired sync between trusted devices: pair with the heart button + 6-digit PIN on both devices
            - Sync with **multiple devices** — each pair syncs independently, content is never forwarded between pairs
            - Auto **clipboard sync** (text up to 16 KB, images up to 8 MB) both ways
            - Auto **shared folder sync** both ways (new/changed files; deletions are not synced)
            - Sync only while the paired device is discovered; offline peers are waited for silently

            ### Downloads
            - Android: `LocalSend-${{ needs.build.outputs.version }}-debug-arm64.apk` (arm64, debug; appears here once the Android build finishes)
            - Windows: `LocalSend-${{ needs.build.outputs.version }}-windows-x64-unsigned.exe` (unsigned — Windows SmartScreen may warn)

            Per-version details are in the pull request / commit history of this fork.
          files: |
            ${{ runner.temp }}\inno-result\LocalSend-${{ needs.build.outputs.version }}-windows-x64-unsigned.exe
          fail_on_unmatched_files: true
